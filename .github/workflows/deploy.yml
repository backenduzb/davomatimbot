name: Build and Push Docker Images

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Admin Service
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/admin:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/admin:${{ github.sha }}

      - name: Build and push GoBot Service
        uses: docker/build-push-action@v5
        with:
          context: ./gobot
          file: ./gobot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/gobot:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/gobot:${{ github.sha }}
