name: Build and Push Docker Images

on:
  push:
    branches: [ "master" ] 

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Service 1
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./admin/Dockerfile 
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/admin:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/admin:${{ github.sha }}

      - name: Build and push Service 2
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./gobot/Dockerfile 
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/gobot:latest
            ghcr.io/${{ steps.owner.outputs.OWNER }}/gobot:${{ github.sha }}